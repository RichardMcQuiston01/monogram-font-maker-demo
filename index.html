<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monogram Font Maker — Demo</title>
    <meta
      name="description"
      content="Upload a ZIP of monogram letter SVGs and get back an installable OTF font, generated entirely in your browser."
    />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="/donate-widget.css" />
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <div id="app" class="mx-auto max-w-2xl px-6 py-12"></div>

    <!-- Floating "Support this project" card. -->
    <aside
      class="donate-card"
      id="donateCard"
      aria-labelledby="donateCardTitle"
    >
      <button
        class="donate-card__dismiss"
        type="button"
        aria-label="Dismiss support message"
        data-donate-dismiss
      >
        &times;
      </button>

      <h2 class="donate-card__title" id="donateCardTitle">
        <span class="donate-card__heart" aria-hidden="true">&#9829;</span>
        Support this project
      </h2>

      <p class="donate-card__body">
        If this app, code, or repository has helped you or someone you know,
        please consider donating. I appreciate any help to offset the costs
        of development and/or AI Credits.
      </p>

      <div class="donate-card__qr">
        <img
          src="/donate.svg"
          alt="QR code linking to the Stripe donation page"
          width="180"
          height="180"
        />
      </div>

      <a
        class="donate-card__link"
        href="https://donate.stripe.com/00w5kD3Gj1Xo9v7gVOcs800"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Donate via Stripe, opens in a new tab"
      >
        Donate via Stripe <span aria-hidden="true">&rarr;</span>
      </a>
    </aside>

    <script type="module" src="/src/main.ts"></script>
    <script src="/donate-widget.js" defer></script>
  </body>
</html>
